<!DOCTYPE html><html><body><canvas id="game" width="1200" height="640"></canvas><pre id="o">RUN</pre>
<script>
window.addEventListener('error', e => { document.getElementById('o').textContent = 'ERR: ' + e.message + ' @' + e.filename.split('/').pop() + ':' + e.lineno; });
</script>
<script type="module">
try {
  await import('./js/main.js');
  const { G } = await import('./js/state.js');
  const { ITEMS } = await import('./js/inventory.js');
  await new Promise(r => setTimeout(r, 300));
  G.menuView = 'forge';
  G.forgeAnim = { start: G.time, id: Object.keys(ITEMS)[0] };
  const seen = [];
  for (let i = 0; i < 30; i++) {
    await new Promise(r => setTimeout(r, 100));
    if (G.forgeAnim) seen.push((G.time - G.forgeAnim.start).toFixed(1));
    else { seen.push('null@' + i); break; }
  }
  document.getElementById('o').textContent = 'OK frames=' + seen.length + ' last=' + seen[seen.length-1];
} catch(e) { document.getElementById('o').textContent = 'CATCH: ' + e.message; }
</script></body></html>
