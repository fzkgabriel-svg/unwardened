<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#000}canvas{display:block}</style></head>
<body>
<canvas id="game" width="1200" height="640"></canvas>
<script type="module">
// capture vidéo : le jeu joue tout seul (autopilote) et envoie ~30 frames/s
// en JPEG 1280x720 au serveur promo/server.py (POST /frame?i=N)
await import('../js/main.js');
const { G } = await import('../js/state.js');
const M = await import('../js/menu.js');
const A = await import('../js/attacks.js');

M.startGame();
G.state = 'playing'; G.cloudT = 0; G.wave = 4; // skip intro, vague riche en ennemis
G.player.maxHp = G.player.hp = 99999;           // l'autopilote ne meurt pas pendant la capture

// autopilote : vise le monstre le plus proche et frappe en continu
setInterval(() => {
  let best = null, bd = 1e9;
  for (const e of G.enemies) {
    const d = Math.hypot(e.x - G.player.x, e.y - G.player.y);
    if (d < bd) { bd = d; best = e; }
  }
  if (best) {
    G.mouse.x = best.x - (G.camX || 0);
    G.mouse.y = best.y - (G.camY || 0);
    A.doSlash();
  }
}, 430);

// envoi des frames à ~30 fps
const src = document.getElementById('game');
const off = document.createElement('canvas');
off.width = 1280; off.height = 720;
const octx = off.getContext('2d');
let i = 0, last = 0;
function loop() {
  requestAnimationFrame(loop);
  const now = performance.now();
  if (now - last < 33) return;
  last = now;
  octx.drawImage(src, 0, 0, 1280, 720);
  off.toBlob(b => { fetch('/frame?i=' + i++, { method: 'POST', body: b }); }, 'image/jpeg', 0.82);
}
loop();
</script>
</body></html>
