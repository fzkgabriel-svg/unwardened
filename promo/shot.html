<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#000}canvas{display:block}</style></head>
<body>
<canvas id="game" width="1200" height="640"></canvas>
<script type="module">
// captures d'écran de gameplay pour la page CrazyGames
// usage : shot.html#game | #boss | #forge | #victory | #menu
const scene = (location.hash || '#game').slice(1);
await import('../js/main.js');           // démarre la boucle de jeu
const { G } = await import('../js/state.js');
const M = await import('../js/menu.js');
const E = await import('../js/enemies.js');
const W = await import('../js/world.js');
W.initWorlds();

if (scene === 'game' || scene === 'boss' || scene === 'victory') {
  M.startGame();
  G.state = 'playing'; G.cloudT = 0; // skip l'intro : capture directe du gameplay
  G.wave = 8; G.waveTarget = 999; // vague avancée : spawns rapides
  // ennemis variés autour du joueur pour une scène vivante
  const types = ['slime', 'bat', 'brute', 'spider', 'golem', 'witch'];
  for (let i = 0; i < 9; i++) {
    const a = i / 9 * Math.PI * 2;
    const d = 130 + (i % 3) * 90;
    E.spawnEnemy(types[i % types.length], false,
      G.player.x + Math.cos(a) * d, G.player.y + Math.sin(a) * d, 0);
  }
  if (scene === 'boss') {
    G.enemies.length = 0;
    E.spawnFinalBoss();
    const fb = G.enemies[0]; if (fb) fb.graceT = 1.2; // emergence visible mais presque finie
  }
  if (scene === 'victory') { G.state = 'victory'; G.kills = 342; G.dmgDealt = 152000; G.player.level = 14; G.runTime = 754; }
} else if (scene === 'forge') {
  G.menuView = 'forge';
}
// #menu : rien à faire, l'écran titre s'affiche seul
setTimeout(() => {
  const d = document.createElement('pre'); d.id = 'dbg';
  d.textContent = `DBG state=${G.state} wave=${G.wave} enemies=${G.enemies.length} view=${G.menuView} kills=${G.kills} time=${G.time.toFixed(1)}`;
  document.body.appendChild(d);
}, 9000);
</script>
</body></html>
