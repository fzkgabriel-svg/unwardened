<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profil d'Aventurier — Kaeloryn Studio</title>
<meta name="description" content="Fiche publique d'un aventurier des Terres Oubliées.">
<link rel="stylesheet" href="/css/site.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><path d='M32 4 54 18v28L32 60 10 46V18Z' fill='none' stroke='%23d4b062' stroke-width='4'/></svg>">
<style>
/* ---------- fiche joueur ---------- */
.jhero { text-align: center; padding: 40px 20px 10px; }
.jhero .ava { width: 110px; height: 110px; border-radius: 50%; margin: 0 auto 16px;
  border: 3px solid var(--gold); object-fit: cover;
  box-shadow: 0 0 34px rgba(212,176,98,.35); }
.jhero .ava.ph { display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #1a1e2c, #0d0f16); font-family: var(--serif);
  font-size: 44px; color: var(--gold); }
.jhero h1 { font-family: var(--serif); color: var(--gold-hi); font-size: 34px;
  letter-spacing: 3px; margin-bottom: 6px; }
.jhero .title { color: var(--ink-dim); font-size: 13px; letter-spacing: 2px; text-transform: uppercase; }
.jstats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 14px; margin: 34px 0; }
.jstat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 18px 12px; text-align: center; }
.jstat b { display: block; font-family: var(--serif); font-size: 26px; color: var(--gold); }
.jstat span { font-size: 10px; letter-spacing: 1.5px; color: var(--ink-dim); text-transform: uppercase; }
.jscore { text-align: center; margin: 10px 0 30px; }
.jscore .big { font-family: var(--serif); font-size: 46px; color: var(--gold-hi);
  text-shadow: 0 0 30px rgba(212,176,98,.35); }
.jscore .lbl { font-size: 11px; letter-spacing: 3px; color: var(--ink-dim); text-transform: uppercase; }
.jnote { text-align: center; color: var(--ink-dim); font-size: 12px; margin-top: 26px; letter-spacing: 1px; }
/* ---------- carte de joueur ---------- */
.pcard { position: relative; border-radius: 16px; padding: 22px 26px; margin: 26px 0 8px;
  display: flex; gap: 20px; align-items: center; overflow: hidden; }
.pcard .pbg { position: absolute; inset: 0; z-index: 0; }
.pcard > * { position: relative; z-index: 1; }
.pava { width: 84px; height: 84px; border-radius: 50%; flex: none; display: flex;
  align-items: center; justify-content: center; font-size: 40px; color: #fff;
  border: 3px solid; }
.pava.ph { background: #14141c; }
.pinfo { flex: 1; min-width: 0; }
.pname { font-family: var(--serif); font-size: 24px; color: #fff; letter-spacing: 1px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ptitle { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; margin: 2px 0 10px; }
.pxpbar { height: 10px; border-radius: 5px; background: rgba(0,0,0,.55);
  border: 1px solid rgba(255,213,79,.35); overflow: hidden; }
.pxpbar i { display: block; height: 100%; border-radius: 5px;
  background: linear-gradient(90deg,#ffd54f,#ff8a65); }
.pxp { font-size: 10px; color: var(--ink-dim); margin-top: 5px; letter-spacing: 1px; }
.pstats { flex: none; text-align: right; font-size: 11px; color: var(--ink-dim); line-height: 1.7; }
.pstats b { color: var(--gold); font-family: var(--serif); font-size: 15px; }
.porn { position: absolute; top: 10px; right: 14px; font-size: 26px; z-index: 1; }
.pcard.transcendant { animation: pcardGlow 2.4s ease-in-out infinite; }
@keyframes pcardGlow { 0%,100% { box-shadow: 0 0 24px rgba(255,234,0,.25); }
  50% { box-shadow: 0 0 44px rgba(255,234,0,.5); } }
@media (max-width: 560px) { .pcard { flex-direction: column; text-align: center; } .pstats { text-align: center; } }
</style>
</head>
<body>
<header class="site"><nav class="top">
  <a class="brand" href="/"><span id="logo"></span>
    <span class="t">KAELORYN<small>STUDIO</small></span></a>
  <div class="links" id="navlinks"></div>
  <div id="navauth" style="display:flex;gap:8px"></div>
</nav></header>

<div class="wrap" style="padding-top:40px;padding-bottom:80px;max-width:760px">
  <div id="content"><div class="jhero"><p style="color:var(--ink-dim)">Chargement de la fiche…</p></div></div>
</div>

<footer class="site"><div class="wrap">
  <div class="fl">KAELORYN STUDIO</div>
  <p>Forge Your Own Legend — © <span id="yr"></span> Kaeloryn Studio. Tous droits réservés.</p>
</div></footer>

<script type="module">
import { mountChrome, LOGO_SVG, esc, api, fmtDate } from '/js/site.js';
import { cosmeticById, BG_CSS, FRAME_CSS, xpNeedFor } from '/js/carddata.js';
document.getElementById('logo').innerHTML = LOGO_SVG;
const pseudo = decodeURIComponent(location.pathname.replace(/^\/joueur\//, '').replace(/\/$/, ''));
const fmt = n => (n || 0).toLocaleString('fr-FR');
const h = s => Math.floor(s / 3600), m = s => Math.floor((s % 3600) / 60);
const playtime = s => s >= 3600 ? `${h(s)}h ${String(m(s)).padStart(2, '0')}` : `${m(s)} min`;

try {
  const d = await api('/api/player/' + encodeURIComponent(pseudo));
  const p = d.player;
  const ava = p.avatar
    ? `<img class="ava" src="${p.avatar}" alt="">`
    : `<div class="ava ph">${esc(p.pseudo[0].toUpperCase())}</div>`;
  // ---- carte de joueur (niveau global + cosmétiques synchronisés du jeu) ----
  let cardHtml = '';
  if (p.glevel != null) {
    const eq = p.card || {};
    const port = cosmeticById(eq.portrait), fram = cosmeticById(eq.frame),
          bg = BG_CSS[eq.background] || BG_CSS.b_terre,
          ttl = cosmeticById(eq.title), orn = cosmeticById(eq.ornament);
    const fc = FRAME_CSS[eq.frame] || FRAME_CSS.f_bois;
    const lvl = Math.min(1000, Math.max(1, p.glevel || 1));
    const need = xpNeedFor(lvl), xp = Math.max(0, p.gxp || 0);
    const pct = need ? Math.min(100, Math.round(xp / need * 100)) : 100;
    const transc = lvl >= 1000 || (ttl && ttl.id === 't_transcendant');
    cardHtml = `
      <div class="pcard${transc ? ' transcendant' : ''}" style="border:3px solid ${fc[0]};background:linear-gradient(135deg,${bg[0]},${bg[1]})">
        ${orn && orn.id !== 'o_rien' ? `<div class="porn">${orn.icon}</div>` : ''}
        <div class="pava${port ? '' : ' ph'}" style="border-color:${port ? port.col : fc[0]};background:${port ? port.col + '33' : '#14141c'}">${port ? port.icon : esc(p.pseudo[0].toUpperCase())}</div>
        <div class="pinfo">
          <div class="pname">${esc(p.pseudo)}</div>
          <div class="ptitle" style="color:${ttl ? ttl.col : '#8f8a7e'}">${ttl ? ttl.icon + ' ' + esc(ttl.nom) : '— Aventurier —'}</div>
          <div class="pxpbar"><i style="width:${pct}%"></i></div>
          <div class="pxp">NIVEAU ${lvl}/1000 · ${lvl >= 1000 ? 'TRANSCENDANT' : fmt(xp) + ' / ' + fmt(need) + ' XP'}</div>
        </div>
        <div class="pstats">
          <b>${p.rewards || 0}</b> récompenses<br>
          <b>${p.glevel || 1}</b> niveau global<br>
          <b>${fmt(p.score)}</b> score
        </div>
      </div>`;
  }
  document.getElementById('content').innerHTML = `
    <div class="panel" style="padding:40px 30px">
      <div class="jhero" style="padding:0">
        ${ava}
        <h1>${esc(p.pseudo)}</h1>
        <div class="title">Aventurier des Terres Oubliées</div>
      </div>
      ${cardHtml}
      <div class="jscore">
        <div class="big">${fmt(p.score)}</div>
        <div class="lbl">Score Général</div>
      </div>
      <div class="jstats">
        <div class="jstat"><b>${p.rank ? '#' + p.rank : '—'}</b><span>Rang mondial</span></div>
        <div class="jstat"><b>${p.level}</b><span>Niveau</span></div>
        <div class="jstat"><b>${p.worlds_done}/6</b><span>Mondes conquis</span></div>
        <div class="jstat"><b>${p.bosses}</b><span>Boss vaincus</span></div>
        <div class="jstat"><b>${p.achievements}</b><span>Succès débloqués</span></div>
        <div class="jstat"><b>${playtime(p.playtime)}</b><span>Temps de jeu</span></div>
        <div class="jstat"><b>${fmtDate(p.member_since)}</b><span>Membre depuis</span></div>
      </div>
      <p class="jnote">Progression synchronisée le ${p.updated_at ? fmtDate(p.updated_at) : '—'}.<br>
      Fiche publique — aucune donnée personnelle n'est affichée.</p>
      <p style="text-align:center;margin-top:20px">
        <a class="btn ghost" href="/classement.html">VOIR LE CLASSEMENT</a></p>
    </div>`;
  document.title = `${p.pseudo} — Aventurier — Kaeloryn Studio`;
} catch (e) {
  document.getElementById('content').innerHTML = `
    <div class="panel"><h2>JOUEUR INTRouvable</h2>
    <p class="sub">Ce pseudo n'existe pas ou n'a pas encore de progression synchronisée.</p>
    <p style="text-align:center"><a class="btn ghost" href="/classement.html">CLASSEMENT</a></p></div>`;
}
mountChrome('classement');
</script>
</body>
</html>
