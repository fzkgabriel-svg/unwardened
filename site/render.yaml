# Blueprint Render — déploiement en un clic :
# Render Dashboard → New → Blueprint → repo Project-Unwardened → Apply
services:
  - type: web
    name: kaeloryn-studio
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: "node server.js"
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_PSEUDO
        sync: false   # à renseigner dans le dashboard Render
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASS
        sync: false
      # --- mot de passe du panneau admin DANS LE JEU (vérifié par /api/admin/verify) ---
      - key: GAME_ADMIN_PASS
        sync: false
      # --- e-mails (vérification / reset mdp) : SMTP obligatoire en prod ---
      # ex : smtps://USER:PASS@smtp.gmail.com:465  (Gmail : mot de passe d'application)
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        value: "Kaeloryn Studio <no-reply@kaeloryn.studio>"
      # --- origines du jeu autorisées à appeler l'API (CORS) ---
      - key: GAME_ORIGINS
        value: "http://localhost:8000,https://unwardened.netlify.app"
