# Blueprint Render — déploiement en un clic :
# Render Dashboard → New → Blueprint → repo Project-Unwardened → Apply
services:
  - type: web
    name: kaeloryn-studio
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: "node server.js"
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_PSEUDO
        sync: false   # à renseigner dans le dashboard Render
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASS
        sync: false
