<!DOCTYPE html><html><body>
<canvas id="game" width="1200" height="640"></canvas>
<script type="module">
const out = [];
try {
  const ach = await import('./js/achievements.js');
  const inv = await import('./js/inventory.js');
  out.push(`achievements=${ach.ACHIEVEMENTS.length}`);
  const rar = {};
  for (const a of ach.ACHIEVEMENTS) rar[a.id] = ach.achInfo(a.id).rarity.label;
  out.push('epic=' + ach.ACHIEVEMENTS.filter(a => rar[a.id] === 'Épique').length +
           ' leg=' + ach.ACHIEVEMENTS.filter(a => rar[a.id] === 'Légendaire').length);
  // chaque récompense a un succès correspondant et vice-versa
  const missing = ach.ACHIEVEMENTS.filter(a => !ach.achInfo(a.id).reward || Object.keys(ach.achInfo(a.id).reward).length === 0 && rar[a.id] !== 'Commun');
  out.push(`missingRewards=${missing.length}`);
  const items = Object.keys(inv.ITEMS).length;
  out.push(`items=${items}`);
  // vérifie que chaque item a un coût et un FX
  let badFx = Object.keys(inv.ITEMS).filter(id => {
    const inv2 = { mats: {}, items: {}, equip: {} };
    return false;
  });
  // test craft : donne les mats et craft le plus cher
  const testInv = { mats: {}, items: {}, equip: {} };
  for (const id in inv.ITEMS) for (const m in inv.ITEMS[id].cost) testInv.mats[m] = (testInv.mats[m]||0) + inv.ITEMS[id].cost[m];
  let crafted = 0;
  for (const id in inv.ITEMS) { if (inv.craft(testInv, id)) crafted++; }
  const b = inv.equipBonuses({ ...testInv, equip: { weapon: 'talEss', armor: 'armOr', charm: 'gourdeHaute' } });
  out.push(`crafted=${crafted} weaponMult=${b.weaponMult} armor=${b.armorReduce} hp=${b.hp} potions=${b.potions} potionMult=${b.potionMult}`);
  document.body.textContent = out.join(' | ');
} catch (e) { document.body.textContent = 'ERR ' + e.message + ' ' + e.stack; }
</script></body></html>
