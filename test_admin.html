<!DOCTYPE html><html><body><canvas id="game" width="1200" height="640"></canvas>
<script type="module">
const out = [];
try {
  await import('./js/main.js');
  const { G } = await import('./js/state.js');
  const m = await import('./js/menu.js');
  const ch = await import('./js/chars.js');
  ch.createChar(0, 'AdminTest'); m.reloadPersistence();
  G.state = 'playing'; G.player.xp = 0;
  const xp0 = G.player.xp;
  // clic sur le bouton XP : rects panneau centré w620 → bouton xp = première colonne
  // on appelle directement par coordonnées connues : panneau px=W/2-310
  // plus simple : balayer adminMenuClickAt sur la grille et voir si 'xp' retourne
  let hit = null;
  for (let y = 200; y < 600 && !hit; y += 4) for (let x = 300; x < 900 && !hit; x += 4) {
    const a = m.adminMenuClickAt(x, y); if (a === 'xp') { hit = {x,y}; break; }
  }
  out.push('xpbtn=' + JSON.stringify(hit));
  if (hit) { m.adminMenuClickAt(hit.x, hit.y); out.push('xp=' + (G.player.xp > xp0 || G.player.level > 1)); }
  out.push('god=' + (m.adminMenuClickAt(0,0), 'skip'));
} catch(e) { out.push('ERR ' + e.message); }
document.title = out.some(l=>l.startsWith('ERR')) ? 'ERR' : 'OK';
document.body.textContent = out.join(' | ');
</script></body></html>
