<!doctype html><html><head><meta charset="utf-8"></head><body><canvas id="game" width="1200" height="640"></canvas><pre id="out">R</pre>
<script type="module">
import { G } from './js/state.js';
import { buildMods, todayChallenge, ngLevel, CHALLENGES, modsLabel } from './js/challenge.js';
import { spawnEnemy } from './js/enemies.js';
const out=[];const T=(n,f)=>{try{out.push(n+'='+(f()??'ok'))}catch(e){out.push(n+'=FAIL:'+e.message)}};
try{
G.state='playing';G.campaign=0;G.wave=5;G.time=1;
G.player={x:600,y:320,r:15,hp:100,maxHp:100,level:1,xp:0,xpNext:50,potions:0,maxPotions:3,alive:true,lastHurt:-99,attackMode:1,speed:2.1,ultCharge:0,ultActive:0,switchLock:0};
G.inv={mats:{},items:{},equip:{},modules:{owned:[],eq:{}}};
G.stats={campaignDone:{},ngPlus:0};
G.enemies=[];G.drops=[];G.portals=[];G.particles=[];G.damageTexts=[];G.rings=[];G.bowShots=[];G.singZones=[];G.modCds={};G.modBuffs={};
T('ng0',()=>ngLevel());
T('challenge',()=>{const c=todayChallenge();return c.id+':'+c.mods?JSON.stringify(c.mods):'?'});
T('mods',()=>{const m=buildMods();return 'ng='+m.ng+' e='+m.enemyMult.toFixed(2)+' x='+m.xpMult.toFixed(2)+' l='+m.lootMult.toFixed(2)+' np='+m.noPotions+' label='+modsLabel()});
// NG+ : campagne 5 finie + ngPlus=3 -> ng=2
G.stats={campaignDone:{5:true},ngPlus:3};
T('ng2',()=>{buildMods();return ngLevel()+'/'+G.mods.enemyMult.toFixed(2)});
// spawn scale check
G.campaign=0;G.mods={enemyMult:2,xpMult:1,lootMult:1,speedMult:1};
G.enemies=[];spawnEnemy('slime',false,700,320,0);
T('spawnScaled',()=>{const e=G.enemies[0];return 'hp='+e.hp+' xp='+e.xp});
document.getElementById('out').textContent='CHAL '+out.join('|');
}catch(e){document.getElementById('out').textContent='FAIL '+e.message}
</script></body></html>
