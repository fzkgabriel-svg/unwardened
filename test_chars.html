<!DOCTYPE html><html><body><canvas id="game" width="1200" height="640"></canvas>
<script type="module">
const out = [];
try {
  const ch = await import('./js/chars.js');
  const st = await import('./js/state.js');
  const inv = await import('./js/inventory.js');
  // slot vide
  out.push('slots=' + JSON.stringify(ch.allSlots().map(s=>s&&s.name)));
  // créer perso 0
  out.push('create0=' + ch.createChar(0, 'TestHéros'));
  out.push('active=' + ch.activeSlot());
  // playtime
  ch.tickPlaytime(120);
  out.push('pt=' + ch.slotMeta(0).playtime);
  // inv préfixée
  inv.addMaterial(st.G.inv, 'cuir', 5);
  out.push('invkey=' + (localStorage.getItem('rpg2d_c0_inv_v3')||'').includes('cuir'));
  // stats clé
  st.saveStats();
  out.push('statkey=' + (localStorage.getItem('rpg2d_c0_stats')!==null));
  // second perso isolé
  ch.createChar(1, 'Second');
  out.push('inv1vide=' + (st.G.inv.mats.cuir||0));
  // reset slot 0 sans toucher slot 1
  ch.deselectChar(); ch.resetChar(0);
  out.push('reset0=' + (ch.slotMeta(0)===null) + ' slot1=' + (ch.slotMeta(1)&&ch.slotMeta(1).name));
  // admin
  out.push('admin=' + ch.checkAdminPass('admin') + '/' + ch.checkAdminPass('nope'));
} catch(e) { out.push('ERR ' + e.message + ' ' + (e.stack||'').split('\n')[1]); }
document.title = out.some(l=>l.startsWith('ERR')) ? 'ERR' : 'OK';
document.body.textContent = out.join(' | ');
</script></body></html>
