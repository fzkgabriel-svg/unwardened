<!DOCTYPE html><html><body>
<canvas id="game" width="1200" height="640"></canvas>
<script type="module">
const out = [];
try {
  const inv = await import('./js/inventory.js');
  const { G } = await import('./js/state.js');
  const testInv = { mats: { fer: 500, cuir: 500, or: 500, essence: 500, cristal: 500 }, items: {}, equip: {}, dur: {} };
  // craft + equip armure
  inv.craft(testInv, 'armOr'); inv.craft(testInv, 'talEss'); inv.craft(testInv, 'gourdeHaute');
  testInv.equip.armor = 'armOr'; testInv.equip.weapon = 'talEss'; testInv.equip.charm = 'gourdeHaute';
  out.push(`dur init=${inv.getDur(testInv,'armOr')}`);
  // 40 coups -> armure (3.0/hit) devrait casser vers ~35 coups
  let brokeAt = -1;
  for (let i = 1; i <= 60; i++) {
    const b = inv.wearEquipment(testInv);
    if (b && brokeAt < 0) brokeAt = i;
    if (testInv.equip.armor === null) break;
  }
  out.push(`armure cassee au coup ~${brokeAt} dur=${inv.getDur(testInv,'armOr')}`);
  out.push(`equip armor=${testInv.equip.armor} weapon=${testInv.equip.weapon}`);
  // bonus: armure cassée = plus d'armorReduce
  const b = inv.equipBonuses(testInv);
  out.push(`armorReduce=${b.armorReduce} weaponMult=${b.weaponMult}`);
  // réparation
  const rc = inv.repairCost(testInv, 'armOr');
  out.push(`repairCost=${JSON.stringify(rc)}`);
  const ok = inv.canRepair(testInv, 'armOr');
  const rep = inv.repairItem(testInv, 'armOr');
  out.push(`canRepair=${ok} repaired=${rep} dur=${inv.getDur(testInv,'armOr')}`);
  // ré-équiper après réparation
  const eq = inv.toggleEquip(testInv, 'armOr');
  out.push(`reequip=${eq} armor=${testInv.equip.armor}`);
  // cassé -> toggleEquip refusé
  testInv.dur.armOr = 0;
  const eq2 = inv.toggleEquip(testInv, 'armOr');
  out.push(`equipCasseRefuse=${!eq2}`);
  document.title = 'OK';
  document.body.textContent = out.join(' | ');
} catch (e) { document.title='ERR'; document.body.textContent = 'ERR ' + e.message + ' ' + e.stack; }
</script></body></html>
