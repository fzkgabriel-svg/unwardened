<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>test gardien</title></head>
<body>
<canvas id="game" width="1200" height="640"></canvas>
<pre id="out"></pre>
<script type="module">
import { G } from './js/state.js';
import { loadInv, loadoutOf, loadoutKeys, weaponAllowed, setLoadoutSlot, modeKey, WEAPON_MODES, modeInfo, modeMult } from './js/inventory.js';
import { doJudgment, doSentence, updateSentence, updateKnifeShots, SENT_CD } from './js/attacks.js';

const out = [];
const ok = (name, cond) => out.push((cond ? 'PASS' : 'FAIL') + ' ' + name);

// ---------- 1. migration ancienne sauvegarde ----------
localStorage.clear();
G.inv = loadInv();
let l = loadoutOf(G.inv);
ok('migration loadout par défaut', l.s1 === 'epee' && l.s2 === 'lance');
ok('weaponAllowed épee', weaponAllowed(G.inv, 'epee'));
ok('weaponAllowed lance', weaponAllowed(G.inv, 'lance'));
ok('weaponAllowed gardien (non équipé)', !weaponAllowed(G.inv, 'gardien'));

// ---------- 2. déblocage / verrou ----------
ok('gardien verrouillé avant boss', !G.stats.gardienUnlocked);
G.stats.gardienUnlocked = true;
// even unlocked, must be equipped to be allowed
ok('gardien autorisé seulement si équipé', !weaponAllowed(G.inv, 'gardien'));

// ---------- 3. équipement dans les emplacements ----------
ok('équiper gardien en s2 (remplace lance)', setLoadoutSlot(G.inv, 's2', 'gardien') === true);
l = loadoutOf(G.inv);
ok('s1=epee s2=gardien', l.s1 === 'epee' && l.s2 === 'gardien');
ok('inv.weapons synchronisé', G.inv.weapons.join(',') === 'epee,gardien');
ok('weaponAllowed gardien après équipement', weaponAllowed(G.inv, 'gardien'));
ok('lance plus autorisée', !weaponAllowed(G.inv, 'lance'));

// swap : mettre gardien en s1
ok('swap gardien vers s1', setLoadoutSlot(G.inv, 's1', 'gardien') === true);
l = loadoutOf(G.inv);
ok('swap résultat s1=gardien s2=epee', l.s1 === 'gardien' && l.s2 === 'epee');

// déséquiper s2 (épee) -> s2 vide, s1 reste
ok('déséquiper s2', setLoadoutSlot(G.inv, 's2', null) === true);
l = loadoutOf(G.inv);
ok('s2 vide après déséquipement', l.s2 === null && l.s1 === 'gardien');
ok('epee toujours possédée (available)', true); // toutes les armes de base sont toujours disponibles

// tenter de déséquiper le dernier -> refus
ok('refus déséquipement dernier', setLoadoutSlot(G.inv, 's1', null) === false);
l = loadoutOf(G.inv);
ok('garde-fou une arme min', l.s1 === 'gardien');

// doublon impossible : équiper gardien en s2 alors qu'il est en s1 -> swap
G.inv.loadout = { s1: 'gardien', s2: 'lance' };
ok('swap anti-doublon', setLoadoutSlot(G.inv, 's2', 'gardien') === true);
l = loadoutOf(G.inv);
ok('pas de doublon', l.s1 === 'lance' && l.s2 === 'gardien');

// ---------- 4. modeKey / modes ----------
ok('modeKey(7)=gardien', modeKey(7) === 'gardien');
ok('WEAPON_MODES gardien=7', WEAPON_MODES.gardien === 7);
ok('modeInfo gardien', typeof modeInfo(G.inv, 'gardien').lvl === 'number');
ok('modeMult gardien', modeMult(G.inv, 'gardien') >= 1);

// ---------- 5. attaque principale : lancer + retour + dégâts par distance ----------
const _rnd = Math.random; Math.random = () => 0.99; // pas de critique : dégâts déterministes
G.state = 'playing'; G.campaign = 0; G.wave = 3;
G.enemies.length = 0;
const p = G.player;
p.x = 600; p.y = 320; p.attackMode = 7; p.attackDamage = 30; p.attackRange = 60;
p.attackCooldown = 0; p.spinDuration = 0; p.switchLock = 0; p.ultActive = 0; p.sentenceT = 0;
p.gardienCombo = 0; p.gardienComboT = null;
G.mouse.x = 700; G.mouse.y = 320; G.camX = 0; G.camY = 0;
// ennemis : un proche devant, un lointain, un derrière
G.enemies.push({ x: 640, y: 320, r: 14, hp: 900, maxHp: 900, type: 'slime', hitFlash: 0 });
G.enemies.push({ x: 880, y: 320, r: 14, hp: 900, maxHp: 900, type: 'slime', hitFlash: 0 });
G.enemies.push({ x: 540, y: 320, r: 14, hp: 900, maxHp: 900, type: 'slime', hitFlash: 0 });
const eClose = G.enemies[0], eFar = G.enemies[1], eBack = G.enemies[2];
doJudgment();
ok('doJudgment lance un couteau', (G.knifeShots || []).length === 1);
ok('couteau en phase aller', G.knifeShots[0].phase === 'out' && G.knifeShots[0].sentence === false);
// vol complet : l'ennemi proche est touché, combo monte, le lointain subit
// des dégâts fortement réduits, le dos est épargné
let g2 = 0;
while (G.knifeShots.length && g2++ < 200) updateKnifeShots(1 / 60);
ok('couteau a touché l\'ennemi proche', eClose.hp < 900);
ok('combo incrémenté par l\'impact', (p.gardienCombo || 0) >= 1);
ok('couteau rate l\'ennemi derrière', eBack.hp === 900);
ok('ennemi lointain touché mais dégâts réduits', eFar.hp < 900 && (900 - eFar.hp) < (900 - eClose.hp) * 0.75);
ok('couteau revenu puis nettoyé', G.knifeShots.length === 0);
ok('attackCooldown posé', p.attackCooldown > 0.35 && p.attackCooldown <= 0.45);
// le couteau fait bien demi-tour : nouvelle lame sur ennemi proche seulement
p.attackCooldown = 0; p.gardienCombo = 0; p.gardienComboT = null;
eClose.hp = 900; eFar.hp = 900;
doJudgment();
g2 = 0;
while (G.knifeShots.length && g2++ < 200) updateKnifeShots(1 / 60);
ok('retour : dégâts proches > dégâts lointains', (900 - eClose.hp) > (900 - eFar.hp) * 1.8);

// ---------- 6. Sentence ancestrale : lames spectrales, dégâts fixes ----------
G.enemies.length = 0; // retirer les enemies de la section 5
p.attackCooldown = 0; p.sentenceCd = 0; p.sentenceT = 0;
doSentence();
ok('sentenceT démarré', p.sentenceT > 0);
ok('sentenceCd posé', p.sentenceCd === SENT_CD);
ok('aucune lame avant la libération', (G.knifeShots || []).length === 0);
// ennemis proche ET lointain sur la trajectoire : Sentence doit infliger
// les mêmes dégâts à l'un et à l'autre (pas de chute de portée)
const eNear = { x: 660, y: 320, r: 14, hp: 900, maxHp: 900, type: 'slime', hitFlash: 0 };
const eFar2 = { x: 880, y: 322, r: 14, hp: 900, maxHp: 900, type: 'slime', hitFlash: 0 };
G.enemies.push(eNear, eFar2);
let guard = 0;
while (p.sentenceT > 0 && guard++ < 200) updateSentence(1 / 60);
ok('libération -> 5 lames spectrales', G.knifeShots.length === 5);
ok('toutes marquées Sentence', G.knifeShots.every(k => k.sentence && k.spectral));
ok('une lame finale plus imposante', G.knifeShots.some(k => k.big && k.r > 10));
ok('dégâts fixes identiques par lame', (() => {
  const ds = new Set(G.knifeShots.filter(k => !k.big).map(k => k.dmg));
  return ds.size === 1;
})());
// simuler vols + délais + retours jusqu'à épuisement
guard = 0;
while (G.knifeShots.length && guard++ < 600) updateKnifeShots(1 / 60);
ok('les deux ennemis ont été touchés', eNear.hp < 900 && eFar2.hp < 900);
// DÉGATS FIXES : une lame spectrale contrôlée inflige le même dégât à un
// ennemi proche et à un ennemi à ~250 px (aucune chute de portée)
G.enemies.length = 0;
const mkSpectral = () => ({
  x: 650, y: 320, vx: 11.5, vy: 0, a: 0, spin: 0, t: 0, phase: 'out',
  traveled: 0, range: 430, r: 8, dmg: 40, hits: new Set(), maxHits: 999,
  sentence: true, delay: 0, spectral: true, big: false, waveDone: false
});
const eSN = { x: 665, y: 320, r: 14, hp: 900, maxHp: 900, type: 'slime', hitFlash: 0 };
const eSF = { x: 890, y: 320, r: 14, hp: 900, maxHp: 900, type: 'slime', hitFlash: 0 };
G.enemies.push(eSN); G.knifeShots.push(mkSpectral());
guard = 0; while (G.knifeShots.length && guard++ < 200) updateKnifeShots(1 / 60);
const lossNear = 900 - eSN.hp;
G.enemies.length = 0; G.knifeShots.length = 0;
G.enemies.push(eSF); G.knifeShots.push(mkSpectral());
guard = 0; while (G.knifeShots.length && guard++ < 200) updateKnifeShots(1 / 60);
const lossFar = 900 - eSF.hp;
ok('Sentence : dégâts identiques proche/lointain', lossNear > 0 && Math.abs(lossNear - lossFar) < 0.01);
// comparaison : une lame principale au même dmg subit la chute de portée
G.enemies.length = 0; G.knifeShots.length = 0;
const mkPrimary = () => ({
  x: 650, y: 320, vx: 16, vy: 0, a: 0, spin: 0, t: 0, phase: 'out',
  traveled: 0, range: 300, r: 7, dmg: 40, hits: new Set(), maxHits: 3,
  sentence: false, delay: 0, spectral: false, big: false, waveDone: false
});
const ePN = { x: 665, y: 320, r: 14, hp: 900, maxHp: 900, type: 'slime', hitFlash: 0 };
const ePF = { x: 890, y: 320, r: 14, hp: 900, maxHp: 900, type: 'slime', hitFlash: 0 };
G.enemies.push(ePN); G.knifeShots.push(mkPrimary());
guard = 0; while (G.knifeShots.length && guard++ < 200) updateKnifeShots(1 / 60);
const pNear = 900 - ePN.hp;
G.enemies.length = 0; G.knifeShots.length = 0;
G.enemies.push(ePF); G.knifeShots.push(mkPrimary());
guard = 0; while (G.knifeShots.length && guard++ < 200) updateKnifeShots(1 / 60);
const pFar = 900 - ePF.hp;
ok('principale : dégâts lointains fortement réduits', pFar > 0 && pFar < pNear * 0.6);
Math.random = _rnd;

// ---------- 7. persistance ----------
// simuler reload : loadInv relit localStorage
const reloaded = loadInv();
const rl = loadoutOf(reloaded);
ok('loadout persisté après reload', rl.s1 === 'lance' && rl.s2 === 'gardien');
ok('weapons synchronisés après reload', reloaded.weapons.join(',') === 'lance,gardien');

// ---------- 8. HUD / rendu (smoke) ----------
try {
  const { drawSkillBar, drawWeaponPanel } = await import('./js/hud/skills.js');
  p.attackMode = 7;
  drawSkillBar(); drawWeaponPanel();
  ok('HUD skills+weaponPanel sans erreur', true);
} catch (e) { ok('HUD skills+weaponPanel sans erreur: ' + e.message, false); }
try {
  const { drawSentenceCharge, drawKnifeShots, drawGardienAura } = await import('./js/gfx/gardien_draw.js');
  p.sentenceT = 0.5; drawSentenceCharge();
  G.knifeShots.push({ x: 700, y: 300, spin: 1.2, sentence: true });
  drawKnifeShots(); G.knifeShots.length = 0;
  drawGardienAura();
  ok('effets Sentence sans erreur', true);
} catch (e) { ok('effets Sentence sans erreur: ' + e.message, false); }
try {
  const { drawWeaponDetail } = await import('./js/menu/forge_gear.js');
  const { setWeaponDetail } = await import('./js/menu/forge_state.js');
  setWeaponDetail('gardien'); drawWeaponDetail();
  setWeaponDetail('epee'); drawWeaponDetail();
  setWeaponDetail(null);
  ok('fiche arme sans erreur', true);
} catch (e) { ok('fiche arme sans erreur: ' + e.message, false); }

document.getElementById('out').textContent = out.join('\n');
</script>
</body></html>
