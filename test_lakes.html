<!DOCTYPE html><html><body>
<canvas id="game" width="1200" height="640"></canvas>
<script type="module">
const out = [];
try {
  const { G } = await import('./js/state.js');
  const world = await import('./js/world.js');
  world.initWorlds();
  const w = world.curWorld();
  out.push(`lakes=${(w.lakes||[]).length} obstacles=${w.obstacles.length} buildings=${w.buildings.length}`);
  for (const l of w.lakes || []) {
    out.push(`lake @${l.x|0},${l.y|0} rx=${l.rx|0} ry=${l.ry|0} bridgeAng=${l.bridge.ang.toFixed(2)} len=${l.bridge.len|0}`);
    // test collision : point au centre du lac -> doit être repoussé hors de l'eau
    const e = { x: l.x, y: l.y, r: 14 };
    world.resolveObstacles(e);
    const dx = e.x - l.x, dy = e.y - l.y;
    const cs = Math.cos(-l.rot), sn = Math.sin(-l.rot);
    const u = (dx*cs - dy*sn) / l.rx, v = (dx*sn + dy*cs) / l.ry;
    const norm = Math.hypot(u, v);
    out.push(`  center->norm=${norm.toFixed(2)} (doit être >=1)`);
    // test pont : point au centre du pont -> doit RESTER (pas repoussé)
    const b = l.bridge;
    const e2 = { x: b.x, y: b.y, r: 14 };
    world.resolveObstacles(e2);
    out.push(`  bridge->moved=${Math.hypot(e2.x-b.x, e2.y-b.y).toFixed(1)} (doit être ~0)`);
    // test anti-chute : sur le pont au milieu de l'eau, on essaie de dériver sur le côté
    const midU = 0; // centre du pont = au-dessus de l'eau
    const px2 = b.x + Math.cos(b.ang) * midU - Math.sin(b.ang) * 0; // = b.x
    const py2 = b.y + Math.sin(b.ang) * midU + Math.cos(b.ang) * 0;
    const e4 = { x: px2 - Math.sin(b.ang) * 30, y: py2 + Math.cos(b.ang) * 30, r: 14 }; // décalé de 30px latéralement
    world.resolveObstacles(e4);
    const vAfter = Math.abs(-(e4.x - b.x) * Math.sin(b.ang) + (e4.y - b.y) * Math.cos(b.ang));
    out.push(`  bridgeSide->v=${vAfter.toFixed(1)} (doit être <= ${(b.wid/2 - 14*0.4).toFixed(1)})`);
    // point sur le bord du lac hors pont -> repoussé dehors
    const ex = l.x + l.rx * 0.98 * Math.cos(l.rot), ey = l.y + l.rx * 0.98 * Math.sin(l.rot);
    const e3 = { x: ex, y: ey, r: 14 };
    // s'assurer que ce point n'est pas sur le pont
    const ba = b.ang, c = Math.cos(ba), s = Math.sin(ba);
    const uu = (ex-b.x)*c + (ey-b.y)*s, vv = -(ex-b.x)*s + (ey-b.y)*c;
    if (!(Math.abs(uu) <= b.len/2 && Math.abs(vv) <= b.wid/2)) {
      world.resolveObstacles(e3);
      const n3 = Math.hypot((e3.x-l.x)/l.rx, (e3.y-l.y)/l.ry);
      out.push(`  edge->norm=${n3.toFixed(2)}`);
    }
  }
  document.title = 'OK';
  document.body.textContent = out.join(' | ');
} catch (e) { document.title = 'ERR'; document.body.textContent = 'ERR ' + e.message + ' ' + e.stack; }
</script></body></html>
