<!DOCTYPE html><html><body><canvas id="game" width="1200" height="640"></canvas>
<script type="module">
const out = [];
try {
  await import('./js/main.js');
  const { G } = await import('./js/state.js');
  const m = await import('./js/menu.js');
  const ch = await import('./js/chars.js');
  // écran personnages vide
  G.menuView = 'characters'; m.resetToMenu ? null : null;
  // forcer état menu
  G.state = 'menu';
  const { drawMenu } = m;
  drawMenu(); out.push('chars-drawn');
  // créer un perso et redraw
  ch.createChar(0, 'HeroTest');
  ch.reloadWorlds ? null : null;
  m.reloadPersistence();
  drawMenu(); out.push('chars-filled');
  // menu principal avec HUD joueur
  G.menuView = 'main'; drawMenu(); out.push('main-drawn');
  // admin (débloqué)
  ch.checkAdminPass('admin');
  G.menuView = 'admin'; drawMenu(); out.push('admin-drawn');
  // retour characters
  G.menuView = 'characters'; drawMenu(); out.push('back');
} catch(e) { out.push('ERR ' + e.message + ' | ' + (e.stack||'').split('\n').slice(0,3).join(' / ')); }
document.title = out.some(l=>l.startsWith('ERR')) ? 'ERR' : 'OK';
document.body.textContent = out.join(' | ');
</script></body></html>
