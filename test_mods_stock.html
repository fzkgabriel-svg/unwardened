<!doctype html><html><head><meta charset="utf-8"></head><body><canvas id="game" width="1200" height="640"></canvas><pre id="out">R</pre>
<script type="module">
import { G } from './js/state.js';
import { MODULES, MOD_IDS, modDmgMult, modDmgReduce, activateModule, modState } from './js/modules.js';
import { MOD_POOL, modShopToday, MOD_DAY_COUNT, buyModule } from './js/shop.js';
import { damageEnemy } from './js/enemies.js';
const out=[];const T=(n,f)=>{try{out.push(n+'='+(f()??'ok'))}catch(e){out.push(n+'=FAIL:'+e.message)}};
try{
G.state='playing';G.campaign=4;G.wave=10;G.time=10;
G.stats={campaignDone:{5:true}};
G.player={x:600,y:320,r:15,hp:90,maxHp:200,level:10,xp:0,xpNext:50,potions:0,maxPotions:3,alive:true,lastHurt:-99,slowT:0,hitSlowT:0,potionCooldown:0,attackMode:1,speed:2.1,ultCharge:0,ultActive:0,switchLock:0,attackCooldown:0,spinCooldown:0,spinDuration:0,modShield:0};
G.inv={mats:{emeraude:99999,cristal:50},items:{},equip:{},modules:{owned:[],eq:{act:null,pass:null,pass2:null},levels:{}},wmode:{}};
G.enemies=[];G.drops=[];G.portals=[];G.particles=[];G.damageTexts=[];G.rings=[];G.bowShots=[];G.singZones=[];G.modCds={};G.modBuffs={};
for(let i=0;i<8;i++)G.enemies.push({x:600+(i-4)*60,y:320,r:14,hp:500,maxHp:500,type:'goblin',name:'g',speed:0,dmg:0,xp:0,color:'#f00',alive:true,spawnT:0});
T('mods',()=>MOD_IDS.length+' pool='+MOD_POOL.length+' today='+modShopToday().length+'/'+MOD_DAY_COUNT);
T('newMods',()=>['rage','carapace','supernova','meteorite'].every(id=>MODULES[id]&&MODULES[id].price>0));
// passif rage : hp<50% -> dmgMult>1 ; carapace : dmgReduce>0
G.inv.modules.eq.pass='rage';G.inv.modules.eq.pass2='carapace';G.inv.modules.owned.push('rage','carapace');
modState(G.inv);
T('rageMult',()=>modDmgMult().toFixed(2));
T('carapaceRed',()=>modDmgReduce().toFixed(2));
G.player.hp=150;T('rageOff',()=>modDmgMult().toFixed(2));
G.inv.modules.eq.act='supernova';G.inv.modules.owned.push('supernova');modState(G.inv);
const hp0=G.enemies.map(e=>e.hp);
T('supernova',()=>{activateModule();return G.enemies.every((e,i)=>e.hp<hp0[i])?'allHit':'miss'});
G.inv.modules.eq.act='meteorite';G.inv.modules.owned.push('meteorite');modState(G.inv);
T('meteorite',()=>{activateModule();return 'ok'});
// stock : cap 4/jour
G.inv.modules={owned:[],eq:{act:null,pass:null,pass2:null},levels:{}};
let buys=0,msgs=[];
for(const id of modShopToday()){const r=buyModule(G.inv,id);if(r.ok)buys++;else msgs.push(r.msg);}
T('dayBuy',()=>buys+'/'+MOD_DAY_COUNT+' offsaleBlocked='+MOD_POOL.filter(i=>!modShopToday().includes(i)).every(i=>!buyModule(G.inv,i).ok)+' '+msgs.slice(0,2).join(';'));
document.getElementById('out').textContent='MODS '+out.join('|');
}catch(e){document.getElementById('out').textContent='FAIL '+e.message}
</script></body></html>
