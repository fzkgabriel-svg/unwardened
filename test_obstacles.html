<!DOCTYPE html><html><body>
<canvas id="game" width="1200" height="640"></canvas>
<script type="module">
const out = [];
try {
  const { G } = await import('./js/state.js');
  const world = await import('./js/world.js');
  const { startTutorial, tutorialEnter, updateTutorial } = await import('./js/tutorial.js');
  const menu = await import('./js/menu.js');

  // 1. Génération du monde + obstacles
  world.initWorlds();
  const w = world.curWorld();
  out.push(`world=${w.w}x${w.h} buildings=${w.buildings.length} obstacles=${w.obstacles.length}`);
  const rocks = w.obstacles.filter(o => o.type === 'rock').length;
  const mtns = w.obstacles.filter(o => o.type === 'mountain').length;
  out.push(`rocks=${rocks} mountains=${mtns}`);
  // collisions : aucune entité spawnée dans un obstacle ?
  const p = G.player;
  world.resolveObstacles(p);
  let bad = 0;
  for (const o of w.obstacles) {
    if (Math.hypot(p.x - o.x, p.y - o.y) < o.r * 0.8 + p.r - 1) bad++;
  }
  out.push(`player-in-obstacle=${bad}`);

  // 2. Tutoriel : start + Enter = étape suivante avec cooldown
  startTutorial();
  out.push(`state=${G.state} tut=${!!G.tutorial}`);
  // simule fin d'intro
  G.state = 'playing'; G.cloudT = 0;
  for (let i = 0; i < 200 && (!G.tutorial || G.tutorial.i < 0); i++) updateTutorial(0.05);
  const step0 = G.tutorial ? G.tutorial.i : -1;
  out.push(`step0=${step0}`);
  // Enter -> étape suivante
  const r1 = tutorialEnter();
  updateTutorial(0.016);
  const step1 = G.tutorial.i;
  const r2 = tutorialEnter(); // doit être refusé (cooldown)
  out.push(`enter1=${r1} step=${step0}->${step1} enter2blocked=${!r2}`);

  // 3. skipCd descend
  for (let i = 0; i < 200; i++) updateTutorial(0.05);
  const r3 = tutorialEnter();
  out.push(`after2.5s enter=${r3} step=${G.tutorial.i}`);

  document.title = 'OK';
  document.body.textContent = out.join(' | ');
} catch (e) {
  document.body.textContent = 'ERR ' + e.message + ' ' + e.stack;
}
</script></body></html>
