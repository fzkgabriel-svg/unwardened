<!DOCTYPE html><html><body><canvas id="game" width="1280" height="720"></canvas><pre id="out">RUN…</pre>
<script type="module">
const out = [];
const ok = (n, c) => out.push((c ? 'PASS' : 'FAIL') + ' ' + n);
try {
  const { G } = await import('./js/state.js');
  const Q = await import('./js/quests.js');
  const V = await import('./js/menu/quests.js');

  G.stats = {}; G.inv = { mats: { emeraude: 10 }, items: {}, modules: {} };
  G.runMats = {};

  // ---------- tirage quotidien ----------
  const d1 = Q.dailyQuests(), d2 = Q.dailyQuests();
  ok('3 quêtes du jour', d1.length === 3);
  ok('tirage déterministe', d1.map(q => q.id).join() === d2.map(q => q.id).join());
  ok('ids uniques', new Set(d1.map(q => q.id)).size === 3);
  ok('toutes dans le pool', d1.every(q => Q.QPOOL.includes(q)));

  // ---------- compteurs ----------
  Q.qAdd('kills', 10); Q.qAdd('kills', 5); Q.qAdd('dmg', 5000);
  Q.qMax('wave', 7); Q.qMax('wave', 4); Q.qMax('wave', 12);
  ok('kills cumulés', G.stats.qday.c.kills === 15);
  ok('wave = max (12)', G.stats.qday.mx.wave === 12);
  ok('dmg cumulés', G.stats.qday.c.dmg === 5000);

  const qs = Q.questState(d1[0]);
  ok('questState retourne cur/done/claimed', qs && typeof qs.cur === 'number' && typeof qs.done === 'boolean' && typeof qs.claimed === 'boolean');

  // ---------- reset à minuit (date changée) ----------
  G.stats.qday.date = '2000-01-01';
  Q.qAdd('kills', 3);
  ok('reset auto au changement de date', G.stats.qday.c.kills === 3 && G.stats.qday.date !== '2000-01-01');

  // ---------- claim ----------
  G.stats.qday = { date: new Date().toLocaleDateString('en-CA'), c: {}, mx: {}, claimed: [] };
  const qq = Q.dailyQuests()[0];
  const fillQ = (store, q) => {
    for (const [m, cflag, t] of [[q.metric, q.c, q.target], [q.metric2, q.c2, q.target2]]) {
      if (!m) continue;
      if (cflag) store.c[m] = t * 2; else store.mx[m] = t;
    }
  };
  fillQ(G.stats.qday, qq);
  const s0 = Q.questState(qq);
  ok('quête marquée done', s0.done === true);
  const emeraldBefore = G.inv.mats.emeraude;
  const r1 = Q.claimQuest(qq.id);
  ok('claim ok', r1.ok === true);
  ok('émeraudes ajoutées', G.inv.mats.emeraude === emeraldBefore + qq.rew);
  const r2 = Q.claimQuest(qq.id);
  ok('double claim refusé', r2.ok === false);
  const notToday = Q.QPOOL.find(q => !Q.dailyQuests().includes(q));
  if (notToday) ok('quête hors du jour refusée', Q.claimQuest(notToday.id).ok === false);
  else ok('quête hors du jour refusée', true);
  ok('questsClaimable/Left renvoient des boolés/nombres', typeof Q.questsClaimable() === 'boolean' && typeof Q.questsLeftToday() === 'number');

  // ---------- quêtes composées + nouveaux compteurs ----------
  const comp = Q.QPOOL.find(q => q.metric2);
  if (comp) {
    G.stats.qday = { date: new Date().toLocaleDateString('en-CA'), c: {}, mx: {}, wl: [], claimed: [] };
    const st = (m, cflag, t) => { if (cflag) G.stats.qday.c[m] = t - 1; else G.stats.qday.mx[m] = t - 1; };
    st(comp.metric, comp.c, comp.target); st(comp.metric2, comp.c2, comp.target2);
    ok('composée : presque → pas done', Q.questState(comp).done === false);
    if (comp.c) G.stats.qday.c[comp.metric] = comp.target * 2; else G.stats.qday.mx[comp.metric] = comp.target;
    ok('composée : 1re seule → pas done', Q.questState(comp).done === false);
    if (comp.c2) G.stats.qday.c[comp.metric2] = comp.target2 * 2; else G.stats.qday.mx[comp.metric2] = comp.target2;
    ok('composée : les deux → done', Q.questState(comp).done === true);
  } else ok('composée : les deux → done', true);
  G.stats.qday = { date: new Date().toLocaleDateString('en-CA'), c: {}, mx: {}, wl: [], claimed: [] };
  Q.qWinWorld(0); Q.qWinWorld(0); Q.qWinWorld(3);
  ok('mondes distincts comptés une fois', G.stats.qday.c.worlds === 2 && G.stats.qday.wl.length === 2);

  // ---------- rendu + clics ----------
  G.state = 'menu'; G.menuView = 'quests'; G.time = 1; G.mouse = { x: 600, y: 300 };
  V.drawQuestsView();
  ok('drawQuestsView ok', true);
  const act = V.questsClickAt(20, 20);
  ok('questsClickAt ne crash pas', act === null || act === 'back' || act === 'claim' || act === 'deny' || act === 'chest');

  // ---------- quêtes hebdomadaires ----------
  const w1 = Q.weeklyQuests(), w2 = Q.weeklyQuests();
  ok('2 quêtes hebdo', w1.length === Q.QUEST_WEEK_COUNT && w1.length === 2);
  ok('tirage hebdo déterministe', w1.map(q => q.id).join() === w2.map(q => q.id).join());
  ok('toutes dans WQPOOL', w1.every(q => Q.WQPOOL.includes(q)));
  const wq = Q.weeklyQuests()[0];
  Q.qAdd('kills', 0); // force l'init de qweek
  const wkKey = G.stats.qweek.week;
  G.stats.qweek = { week: wkKey, wl: [], c: { kills: 9e9, dmg: 9e9, bosses: 9e9, emerald: 9e9, mats: 9e9, mods: 9e9, victories: 9e9, potions: 9e9, time: 9e9, worlds: 9, ult: 9e9, craft: 9e9, dist: 9e9, flawless: 9 }, mx: { wave: 99, level: 99 }, claimed: [] };
  const modsBefore = (G.inv.modules && G.inv.modules.owned || []).length;
  const wr = Q.claimWeekly(wq.id);
  ok('claim hebdo ok', wr.ok === true);
  ok('coffre → module ajouté', (G.inv.modules.owned || []).length === modsBefore + 1);
  ok('chestFx posé', !!G.chestFx && G.chestFx.until > G.time);
  ok('double claim hebdo refusé', Q.claimWeekly(wq.id).ok === false);
  ok('weekCountdown positif', Q.weekCountdown() > 0);
  ok('drawQuestsView avec hebdo ok', (V.drawQuestsView(), true));

} catch (e) { out.push('FAIL ' + e.message + ' ' + (e.stack || '').split('\n')[1]); }
document.getElementById('out').textContent = out.join('\n');
</script></body></html>
